name: Enterprise Hygiene (Layers B–E)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: enterprise-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  hygiene:
    name: Enterprise Layers B–E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect product packages
        id: js
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          web_exists=false
          dashboard_exists=false
          [ -f web/package-lock.json ] && web_exists=true
          [ -f dashboard/package-lock.json ] && dashboard_exists=true
          echo "web=${web_exists}" >> "$GITHUB_OUTPUT"
          echo "dashboard=${dashboard_exists}" >> "$GITHUB_OUTPUT"
          if [ "$web_exists" = true ] || [ "$dashboard_exists" = true ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

          # npm audit stays --audit-level=high. It runs when that tree's
          # lockfile/manifest changed (or on workflow_dispatch). Unrelated
          # slices should not fail on pre-existing advisories in another app.
          lockfile_changed() {
            local dir="$1"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              return 0
            fi
            if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              return 0
            fi
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
              "${dir}/package.json" "${dir}/package-lock.json" | grep -q .
          }

          if [ "$dashboard_exists" = true ] && lockfile_changed dashboard; then
            echo "audit_dashboard=true" >> "$GITHUB_OUTPUT"
          else
            echo "audit_dashboard=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$web_exists" = true ] && lockfile_changed web; then
            echo "audit_web=true" >> "$GITHUB_OUTPUT"
          else
            echo "audit_web=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        if: steps.js.outputs.any == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      # ── Layer B: secrets + dependency audit ─────────────────────────
      - name: "B · Gitleaks secret scan"
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            -o "/tmp/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "/tmp/${ARCHIVE}" gitleaks
          gitleaks version
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --exit-code 1

      - name: "B · pip-audit (governance)"
        working-directory: governance
        run: |
          python -m pip install -U "pip>=25.3" pip-audit
          pip install -e ".[dev]"
          python -m pip_audit --progress-spinner off

      - name: "B · npm ci (dashboard)"
        if: steps.js.outputs.dashboard == 'true'
        working-directory: dashboard
        run: npm ci

      - name: "B · npm audit (dashboard)"
        if: steps.js.outputs.audit_dashboard == 'true'
        working-directory: dashboard
        run: npm audit --audit-level=high

      - name: "B · npm ci (web)"
        if: steps.js.outputs.web == 'true'
        working-directory: web
        run: npm ci

      - name: "B · npm audit (web)"
        if: steps.js.outputs.audit_web == 'true'
        working-directory: web
        run: npm audit --audit-level=high

      # ── Layer C: lint + SAST ────────────────────────────────────────
      - name: "C · ESLint (dashboard)"
        if: steps.js.outputs.dashboard == 'true'
        working-directory: dashboard
        run: npm run lint

      - name: "C · ESLint (web)"
        if: steps.js.outputs.web == 'true'
        working-directory: web
        run: npm run lint

      - name: "C · Typecheck (web)"
        if: steps.js.outputs.web == 'true'
        working-directory: web
        run: npx tsc --noEmit

      - name: "C · Semgrep"
        run: |
          set -euo pipefail
          IMAGE="semgrep/semgrep:1.110.0"
          docker pull "$IMAGE"

          PATHS=()
          for d in governance infra .github web dashboard; do
            if [ -d "$d" ]; then
              PATHS+=("$d")
            fi
          done
          if [ "${#PATHS[@]}" -eq 0 ]; then
            echo "No Semgrep scan roots found" >&2
            exit 1
          fi

          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" \
            semgrep scan \
              --config .semgrep.yml \
              --error \
              --metrics off \
              "${PATHS[@]}"

          JS_PATHS=()
          for d in web dashboard; do
            if [ -d "$d" ]; then
              JS_PATHS+=("$d")
            fi
          done
          if [ "${#JS_PATHS[@]}" -gt 0 ]; then
            docker run --rm -v "$PWD:/src" -w /src "$IMAGE" \
              semgrep scan \
                --config p/javascript \
                --config p/typescript \
                --config p/owasp-top-ten \
                --severity=ERROR \
                --error \
                --metrics off \
                "${JS_PATHS[@]}"
          else
            echo "No JS/TS product trees yet; skipped registry OWASP packs."
          fi

      # ── Layer D: standing tests + product builds when present ───────
      - name: "D · Unit tests (governance)"
        working-directory: governance
        run: pytest -q

      - name: "D · Unit tests (web)"
        if: steps.js.outputs.web == 'true'
        working-directory: web
        run: npm test

      - name: "D · Next.js build (web)"
        if: steps.js.outputs.web == 'true'
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
        run: npm run build

      - name: "D · Next.js build (dashboard)"
        if: steps.js.outputs.dashboard == 'true'
        working-directory: dashboard
        env:
          SITE_PASSWORD: ci-site-password
          DASHBOARD_INGEST_SECRET: ci-ingest-secret
        run: npm run build

      # ── Layer E: IaC ────────────────────────────────────────────────
      - name: "E · Checkov (Terraform)"
        uses: bridgecrewio/checkov-action@1246d92f57abae29d5db5f9aeeed2a9813e52d7d # v12
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: false
          output_format: cli
          config_file: infra/terraform/.checkov.yml
