name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Export static app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve Pages env
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          CUSTOM_BASE="${{ vars.NEXT_PUBLIC_BASE_PATH }}"
          if [ "$CUSTOM_BASE" = "/" ] || [ "$CUSTOM_BASE" = "none" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            BASE=""
          elif [ -n "$CUSTOM_BASE" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=$CUSTOM_BASE" >> "$GITHUB_ENV"
            BASE="$CUSTOM_BASE"
          elif [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            BASE=""
          else
            echo "NEXT_PUBLIC_BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
            BASE="/${REPO}"
          fi

          SITE="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          if [ -z "$SITE" ]; then
            SITE="https://${OWNER}.github.io${BASE}"
          fi
          echo "NEXT_PUBLIC_SITE_URL=${SITE%/}" >> "$GITHUB_ENV"

          URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}"
          KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          if [ -z "$URL" ]; then URL="https://example.supabase.co"; fi
          if [ -z "$KEY" ]; then KEY="ci-placeholder-anon-key-not-a-secret"; fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install and export
        working-directory: web
        env:
          GITHUB_PAGES: "1"
        run: |
          npm ci
          npm run build:pages

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/out

  deploy:
    name: Deploy Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
