<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080c0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>AuraHUD</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #080c0b;
        color-scheme: dark;
      }
    </style>
  </head>
  <body style="background: #080c0b">
    <script>
      (async function () {
        var url = location.href;
        var lockKey = "alte-boot-lock";
        function appBase() {
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              return new URL(
                "./",
                navigator.serviceWorker.controller.scriptURL,
              ).pathname.replace(/\/$/, "");
            }
          } catch (e) {}
          var path = location.pathname;
          var known = [
            "/hud",
            "/login",
            "/budget",
            "/accounts",
            "/home-chat",
            "/trust",
            "/settings",
            "/privacy",
            "/insights",
            "/transactions",
            "/import",
            "/offline",
            "/invite",
            "/passkey-setup",
            "/auth",
          ];
          for (var i = 0; i < known.length; i++) {
            var idx = path.indexOf(known[i]);
            if (idx > 0) return path.slice(0, idx);
          }
          return "";
        }
        try {
          // If replace served boot.html again, stop. Real pages clear this lock.
          if (sessionStorage.getItem(lockKey) === url) {
            sessionStorage.removeItem(lockKey);
            return;
          }
          sessionStorage.setItem(lockKey, url);
          var res = await fetch(url, {
            credentials: "same-origin",
            cache: "reload",
            headers: {
              Accept: "text/html",
              "X-Alte-Boot": "1",
            },
          });
          if (!res.ok) throw new Error("boot fetch failed");
          location.replace(url);
        } catch (e) {
          sessionStorage.removeItem(lockKey);
          location.replace(appBase() + "/offline.html");
        }
      })();
    </script>
  </body>
</html>
