<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080c0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>AuraHUD</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #080c0b;
        color-scheme: dark;
      }
    </style>
  </head>
  <body style="background: #080c0b">
    <script>
      (async function () {
        var url = location.href;
        function appBase() {
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              return new URL(
                "./",
                navigator.serviceWorker.controller.scriptURL,
              ).pathname.replace(/\/$/, "");
            }
          } catch (e) {}
          var path = location.pathname;
          var known = [
            "/hud",
            "/login",
            "/budget",
            "/accounts",
            "/home-chat",
            "/trust",
            "/settings",
            "/privacy",
            "/insights",
            "/transactions",
            "/import",
            "/offline",
            "/invite",
            "/passkey-setup",
            "/auth",
          ];
          for (var i = 0; i < known.length; i++) {
            var idx = path.indexOf(known[i]);
            if (idx > 0) return path.slice(0, idx);
          }
          return "";
        }
        try {
          var res = await fetch(url, {
            credentials: "same-origin",
            cache: "reload",
            headers: {
              Accept: "text/html",
              "X-Alte-Boot": "1",
            },
          });
          if (!res.ok) throw new Error("boot fetch failed");
          if (res.headers.get("X-Alte-Boot-Shell") === "1") {
            throw new Error("boot fetched another shell");
          }
          var html = await res.text();
          if (!html) throw new Error("empty boot document");
          // Paint in place. location.replace() re-enters this shell and can
          // leave a blank black page when the page cache does not match.
          document.open();
          document.write(html);
          document.close();
        } catch (e) {
          location.replace(appBase() + "/offline.html");
        }
      })();
    </script>
  </body>
</html>
